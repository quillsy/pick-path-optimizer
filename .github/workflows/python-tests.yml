name: Python tests

on:
  push:
    branches:
      - feat/section-geometry-foundation
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Record data hashes before tests
        run: |
          mkdir -p /tmp/test-runner
          # Capture all files under data/ and compute SHA-256
          find data -type f | sort | xargs shasum -a 256 > /tmp/test-runner/before_hashes.txt

      - name: Run tests
        run: |
          set -e
          set -o pipefail
          echo "Testing commit: ${{ github.sha }}"
          echo "Python version: ${{ matrix.python-version }}"
          python -B -m unittest discover -s tests -v 2>&1 | tee test_output.txt
          if grep -q "Ran 0 tests" test_output.txt; then
            echo "Error: No tests found."
            exit 1
          fi

      - name: Verify data integrity
        if: always()
        run: |
          if [ -f /tmp/test-runner/before_hashes.txt ]; then
            find data -type f 2>/dev/null | sort | xargs shasum -a 256 > /tmp/test-runner/after_hashes.txt || true
            if ! diff -u /tmp/test-runner/before_hashes.txt /tmp/test-runner/after_hashes.txt; then
              echo "Error: Data files under data/ were added, removed, or modified during tests. This is a check of the end state, not all intermittent writes."
              exit 1
            else
              echo "Data integrity verified: end state matches initial state."
            fi
          fi
