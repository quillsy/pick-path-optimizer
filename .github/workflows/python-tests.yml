name: Python tests

on:
  push:
    branches:
      - feat/section-geometry-foundation
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Record data hashes before tests
        id: data_snapshot
        run: |
          python3 -c "
          import os, sys, json, hashlib
          def generate_manifest(directory):
              if not os.path.exists(directory):
                  print(f'Error: Directory {directory} does not exist.')
                  sys.exit(1)
              manifest = {}
              def on_error(err):
                  print(f'Error accessing directory: {err}')
                  sys.exit(1)
              for root, dirs, files in os.walk(directory, onerror=on_error):
                  for f in files:
                      path = os.path.join(root, f)
                      if os.path.islink(path):
                          print(f'Error: Symbolic link found at {path}, explicitly rejected.')
                          sys.exit(1)
                      if not os.path.isfile(path): continue
                      try:
                          with open(path, 'rb') as f_obj:
                              h = hashlib.sha256()
                              while chunk := f_obj.read(8192):
                                  h.update(chunk)
                              manifest[path] = h.hexdigest()
                      except Exception as e:
                          print(f'Error reading file {path}: {e}')
                          sys.exit(1)
              return manifest
          manifest = generate_manifest('data')
          output_path = os.path.join(os.environ.get('RUNNER_TEMP', '/tmp'), 'before_hashes.json')
          with open(output_path, 'w', encoding='utf-8') as out:
              json.dump(manifest, out, indent=2, sort_keys=True)
          print('Manifest generated successfully.')
          "

      - name: Run tests
        run: |
          set -e
          set -o pipefail
          echo "Testing commit: ${{ github.sha }}"
          echo "Python version: ${{ matrix.python-version }}"
          python -B -m unittest discover -s tests -v 2>&1 | tee test_output.txt
          if grep -q "Ran 0 tests" test_output.txt; then
            echo "Error: No tests found."
            exit 1
          fi

      - name: Verify data integrity
        if: ${{ always() && steps.data_snapshot.outcome == 'success' }}
        run: |
          python3 -c "
          import os, sys, json, hashlib
          def generate_manifest(directory):
              if not os.path.exists(directory):
                  print(f'Error: Directory {directory} does not exist.')
                  sys.exit(1)
              manifest = {}
              def on_error(err):
                  print(f'Error accessing directory: {err}')
                  sys.exit(1)
              for root, dirs, files in os.walk(directory, onerror=on_error):
                  for f in files:
                      path = os.path.join(root, f)
                      if os.path.islink(path):
                          print(f'Error: Symbolic link found at {path}')
                          sys.exit(1)
                      if not os.path.isfile(path): continue
                      try:
                          with open(path, 'rb') as f_obj:
                              h = hashlib.sha256()
                              while chunk := f_obj.read(8192):
                                  h.update(chunk)
                              manifest[path] = h.hexdigest()
                      except Exception as e:
                          print(f'Error reading file {path}: {e}')
                          sys.exit(1)
              return manifest
          before_path = os.path.join(os.environ.get('RUNNER_TEMP', '/tmp'), 'before_hashes.json')
          if not os.path.exists(before_path):
              print('Error: before_hashes.json missing')
              sys.exit(1)
          with open(before_path, 'r', encoding='utf-8') as f:
              before_manifest = json.load(f)
          after_manifest = generate_manifest('data')
          if before_manifest != after_manifest:
              print('Error: Data files under data/ were added, removed, or modified during tests.')
              sys.exit(1)
          else:
              print('Data integrity verified: end state matches initial state.')
          "
